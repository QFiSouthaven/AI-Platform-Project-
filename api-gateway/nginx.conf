# Common server configuration (included by both HTTP and HTTPS servers)
# Save this as /etc/nginx/conf.d/common.conf or inline it
# BEGIN COMMON CONFIGURATION

    # Access and error logs
    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # Request ID for tracing
    set $request_id $request_id;
    if ($http_x_request_id) {
        set $request_id $http_x_request_id;
    }

    # Security headers
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS Configuration
    set $cors_origin "";
    if ($http_origin ~* (https?://localhost(:[0-9]+)?|https?://.*\.aiplatform\.com)) {
        set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, X-Correlation-ID" always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Max-Age 86400 always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Connection limits
    limit_conn conn_limit 100;

    # Client body size limit
    client_max_body_size 100M;
    client_body_buffer_size 16k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"api-gateway","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Readiness check endpoint
    location /ready {
        access_log off;
        return 200 '{"status":"ready","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # Metrics endpoint (for Prometheus)
    location /metrics {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # ===========================================
    # Module 1: User Gateway Routes
    # ===========================================

    # Authentication endpoints (stricter rate limiting)
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://user_gateway/api/v1/auth/;

        # Don't cache auth responses
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # User management endpoints
    location /api/v1/users/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://user_gateway/api/v1/users/;
    }

    # ===========================================
    # Module 2: Workflow Orchestration Routes
    # ===========================================

    # Workflow management endpoints
    location /api/v1/workflows/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://workflow_orchestration/api/v1/workflows/;

        # Longer timeout for workflow operations
        proxy_read_timeout 120s;
    }

    # Task management endpoints
    location /api/v1/tasks/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://workflow_orchestration/api/v1/tasks/;

        proxy_read_timeout 120s;
    }

    # ===========================================
    # Module 3: Core Processing Routes
    # ===========================================

    # Code generation endpoints (stricter rate limiting due to resource intensity)
    location /api/v1/generate/ {
        limit_req zone=generate_limit burst=10 nodelay;
        proxy_pass http://core_processing/api/v1/generate/;

        # Extended timeout for LLM operations
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Larger buffer for code generation responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Debug and analysis endpoints
    location /api/v1/debug/ {
        limit_req zone=generate_limit burst=10 nodelay;
        proxy_pass http://core_processing/api/v1/debug/;

        proxy_read_timeout 300s;
    }

    # ===========================================
    # Module 4: Data Integration Routes
    # ===========================================

    # Event streaming endpoints
    location /api/v1/events/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://data_integration/api/v1/events/;

        # Support for SSE (Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # Cache management endpoints
    location /api/v1/cache/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://data_integration/api/v1/cache/;

        # Quick timeout for cache operations
        proxy_read_timeout 10s;
    }

    # ===========================================
    # Module 5: Model Management Routes
    # ===========================================

    # Model management endpoints
    location /api/v1/models/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://model_management/api/v1/models/;

        # Extended timeout for model uploads/downloads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Larger body size for model uploads
        client_max_body_size 5G;
    }

    # Plugin management endpoints
    location /api/v1/plugins/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://model_management/api/v1/plugins/;
    }

    # ===========================================
    # Module 6: Infrastructure Routes
    # ===========================================

    # Infrastructure management endpoints
    location /api/v1/infrastructure/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://infrastructure/api/v1/infrastructure/;

        proxy_read_timeout 120s;
    }

    # ===========================================
    # WebSocket Support
    # ===========================================

    location /ws/ {
        proxy_pass http://data_integration/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===========================================
    # Static Files and Documentation
    # ===========================================

    location /docs {
        alias /usr/share/nginx/html/docs;
        index index.html;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
        return 200 "User-agent: *\nDisallow: /api/\n";
    }

    # Default error pages
    error_page 404 /404.json;
    error_page 500 502 503 504 /50x.json;

    location = /404.json {
        internal;
        return 404 '{"status":"error","error":{"code":"NOT_FOUND","message":"The requested resource was not found"},"timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    location = /50x.json {
        internal;
        return 500 '{"status":"error","error":{"code":"INTERNAL_ERROR","message":"An internal server error occurred"},"timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

# END COMMON CONFIGURATION
