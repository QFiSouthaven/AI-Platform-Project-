# AI Platform API Gateway - NGINX Configuration
# Routes requests to appropriate microservices with rate limiting, CORS, and SSL support

# Define upstream servers for each module
upstream user_gateway {
    server user-gateway:8001;
    keepalive 32;
}

upstream workflow_orchestration {
    server workflow-orchestration:8002;
    keepalive 32;
}

upstream core_processing {
    server core-processing:8003;
    keepalive 32;
}

upstream data_integration {
    server data-integration:8004;
    keepalive 32;
}

upstream model_management {
    server model-management:8005;
    keepalive 32;
}

upstream infrastructure {
    server infrastructure:8006;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=generate_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Cache configuration
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

# Logging format
log_format json_combined escape=json
    '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Redirect HTTP to HTTPS in production
    # Uncomment below for production
    # return 301 https://$server_name$request_uri;

    # Include common configurations
    include /etc/nginx/conf.d/common.conf;
}

