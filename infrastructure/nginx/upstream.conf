# Upstream Server Configuration for Infrastructure Module
# This file defines the backend servers for load balancing

# Main infrastructure backend pool
upstream infrastructure_backend {
    # Load balancing method (round-robin by default)
    # Options: round-robin (default), least_conn, ip_hash, hash
    least_conn;

    # Keep alive connections to backend
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;

    # Backend servers
    # In production, these would be multiple instances
    server 127.0.0.1:8006 weight=1 max_fails=3 fail_timeout=30s;
    # server infrastructure-1:8006 weight=1 max_fails=3 fail_timeout=30s;
    # server infrastructure-2:8006 weight=1 max_fails=3 fail_timeout=30s;
    # server infrastructure-3:8006 weight=2 max_fails=3 fail_timeout=30s;

    # Backup servers (used when primary servers are unavailable)
    # server infrastructure-backup:8006 backup;
}

# Ray dashboard backend (if exposed)
upstream ray_dashboard {
    server 127.0.0.1:8265;
    keepalive 8;
}

# Separate pool for high-priority tasks (optional)
upstream infrastructure_priority {
    least_conn;
    keepalive 16;

    server 127.0.0.1:8006 weight=1;
    # server infrastructure-priority-1:8006 weight=2;
    # server infrastructure-priority-2:8006 weight=2;
}
