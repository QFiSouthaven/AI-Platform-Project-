apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: infrastructure-module-hpa
  namespace: ai-platform
  labels:
    app: infrastructure-module
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infrastructure-module

  # Replica limits
  minReplicas: 2
  maxReplicas: 10

  # Metrics for scaling decisions
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

    # Custom metrics (requires metrics-server and custom metrics adapter)
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_requests_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: 1000

    # - type: External
    #   external:
    #     metric:
    #       name: queue_depth
    #       selector:
    #         matchLabels:
    #           service: infrastructure-module
    #     target:
    #       type: AverageValue
    #       averageValue: 100

  # Scaling behavior
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
        - type: Percent
          value: 50
          periodSeconds: 120
      selectPolicy: Min

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: infrastructure-module-pdb
  namespace: ai-platform
  labels:
    app: infrastructure-module
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: infrastructure-module
