apiVersion: v1
kind: Service
metadata:
  name: infrastructure-module
  namespace: ai-platform
  labels:
    app: infrastructure-module
    component: infrastructure
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8006"
spec:
  type: ClusterIP
  selector:
    app: infrastructure-module
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
# Headless service for internal communication
apiVersion: v1
kind: Service
metadata:
  name: infrastructure-module-headless
  namespace: ai-platform
  labels:
    app: infrastructure-module
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: infrastructure-module
  ports:
    - name: http
      port: 8006
      targetPort: http
      protocol: TCP

---
# NodePort service for external access (development)
apiVersion: v1
kind: Service
metadata:
  name: infrastructure-module-nodeport
  namespace: ai-platform
  labels:
    app: infrastructure-module
spec:
  type: NodePort
  selector:
    app: infrastructure-module
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30006
      protocol: TCP

